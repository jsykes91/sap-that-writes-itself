# eSAP configuration for PIONEER 1
# ---------------------------------
# esap.py reads this file to know which template and metadata to use, and how the
# metadata sheets relate to each other. To build a SAP for another study, copy this
# file (e.g. to mystudy.toml), change the [study] and [files] sections, and run:
#     run_esap.bat mystudy.toml
# Paths are relative to the folder this file is in.

[study]
label = "PIONEER 1"                      # used in messages and the run log only

[files]
template = "input/TEMPLATE_SAP_001.docx"
metadata = "input/pioneer1-metadata.xlsx"
# {Name} is replaced by that field's value on the Study sheet; spaces are removed
# from the file name, so "PIONEER 1" becomes "PIONEER1". The run log is written
# next to it with "_run_log.txt" on the end.
output = "sap/{Short title}_SAP_v{SAP version}.docx"

[document]
# Word document properties (File > Info) of the finished SAP. {Name} as above.
title = "{Short title} Statistical Analysis Plan, version {SAP version}"
description = "Draft generated by esap.py from the eSAP template and study metadata."
not_applicable = "Not applicable"        # shown where a level has no rows
date_format = "%-d %B %Y"                # for dates typed as Excel dates (%-d = day without a leading zero)
# Template guidance paragraphs that explain the eSAP mechanics to template authors
# and so are removed from the finished SAP (any paragraph containing this text):
remove_paragraphs_containing = ["the eSAP script repeats it"]

[study_sheet]
# The Study sheet is a list of single fields: one row per field.
sheet = "Study"
field_column = "Field"
value_column = "Value"
# Fields that may be left blank. A blank one keeps the template's grey "Enter ..."
# prompt so it is easy to spot and fill in later. Any other blank field stops the run.
optional_fields = ["Sponsor legal address"]

[metadata]
trace_column = "SAP fields"              # the green column listing each row's SAP field names
ignore_columns = ["Source"]              # columns that are for reference only (not reported as unused)

# One section per repeating sheet. id_column is the row ID used to name each copy,
# e.g. [OBJ1]. A sheet with parent_sheet belongs to a row on that sheet, matched by
# parent_column. level_column gives the row's level; child rows take their parent's level.
[sheets.Registries]
id_column = "Registry ID"

[sheets."Version history"]
id_column = "Version ID"

[sheets.Objectives]
id_column = "Objective ID"
level_column = "Level"

[sheets.Estimands]
id_column = "Estimand ID"
parent_sheet = "Objectives"
parent_column = "Objective ID"

[sheets."Intercurrent events"]
id_column = "Event ID"
parent_sheet = "Estimands"
parent_column = "Estimand ID"

# Controls whose value is a number worked out by the script, not read from a cell:
# rows of this sheet are numbered 1, 2, 3 ... within each level, in sheet order.
[numbering."Objective number"]
sheet = "Objectives"

# Estimands whose Role is listed here are placed under the template's
# "Supplementary Estimand(s) for ..." subheading instead of the main one.
[[split]]
group = "Estimand"
column = "Role"
values = ["Supplementary"]
after_paragraph_starting = "Supplementary Estimand"

[checks]
# An estimand's Role must match its objective's Level (a Primary objective has a
# Primary estimand), except for these roles, which may sit under any level:
role_sheet = "Estimands"
role_column = "Role"
roles_any_level = ["Supplementary"]
# The SAP version on the Study sheet must appear on the Version history sheet:
version_sheet = "Version history"
version_column = "Version"
version_date_column = "Date"
study_version_field = "SAP version"
study_date_field = "SAP date"
# An estimand's endpoint is expected to match its objective's endpoint (a note, not a stop):
endpoint_column = "Endpoint"

# Allowed values normally come from the workbook's drop-down lists. To override,
# list them here as "Sheet.Column" = [ ... ], e.g.
# [allowed]
# "Objectives.Level" = ["Primary", "Secondary", "Exploratory"]
